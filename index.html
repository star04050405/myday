*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);

line-height:1.75;padding:0 18px calc(64px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto}

.logo{font-size:26px;font-weight:900;letter-spacing:.02em}
.logo em{font-style:normal;color:var(--coral)}
.datebar{font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.06em}
/* 进度卡 */
.hero{background:linear-gradient(150deg,var(--coral),#DE9A8C 80%);border-radius:22px;color:#FFF9F5;
padding:22px 22px 18px;margin-top:14px;box-shadow:0 14px 30px rgba(232,131,127,.28);position:relative;overflow:hidden}
.hero::after{content:'✿';position:absolute;right:-14px;top:-22px;font-size:110px;opacity:.14}
.hero .hl{font-size:12px;font-weight:800;letter-spacing:.22em;opacity:.85}
.hero .big{font-size:52px;font-weight:900;line-height:1.15;letter-spacing:.01em}
.hero .big span{font-size:20px;font-weight:800;opacity:.85}
.hero .bar{height:10px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:12px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#FFF9F5;border-radius:99px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.hero .sub{font-size:11px;margin-top:9px;opacity:.85;font-weight:700;letter-spacing:.08em}
/* 分段 */
.slot-h{display:flex;align-items:center;gap:10px;margin:26px 2px 8px}
.slot-h .sn{font-size:12px;font-weight:900;letter-spacing:.24em;color:var(--sub)}
.slot-h .sr{flex:1;height:1px;background:var(--line)}
/* 时间轴行 */
.row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
border-radius:16px;padding:12px 14px;margin-bottom:9px;box-shadow:0 2px 8px rgba(58,50,48,.04)}
.row.done{background:var(--soft)}
.row.done .nm{text-decoration:none;color:var(--sub)}
.row .tm{font-family:"Courier New",monospace;font-size:12px;font-weight:800;color:var(--coral-d);
min-width:44px;cursor:pointer;letter-spacing:.02em;background:var(--soft);padding:4px 6px;border-radius:8px;text-align:center}
.row.done .tm{color:var(--sub)}
.row .cir{width:30px;height:30px;border-radius:50%;border:2px solid var(--coral);flex-shrink:0;cursor:pointer;
display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:all .2s}
.row.done .cir{background:var(--olive);border-color:var(--olive);color:#fff}
.row .em{font-size:21px;flex-shrink:0}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:14.5px;font-weight:800;letter-spacing:.02em}
.row .ds{font-size:10.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{font-size:16px;color:#C9BBB0;width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px}
.row .rm:active{background:var(--soft)}
/* 空态 */
.empty{text-align:center;color:var(--sub);font-size:12.5px;padding:30px 0;letter-spacing:.08em}
/* 编辑页 */
#edit{display:none}
.grp{margin-top:24px}
.grp-h{display:flex;align-items:center;gap:11px;padding:4px 2px 0}
.grp-h .gi{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px}
.grp-h .gt{font-size:16.5px;font-weight:900}
.grp-h .gd{font-size:10px;color:var(--sub);letter-spacing:.03em}
.grow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:10px 13px;margin-top:8px}
.grow.off{opacity:.45}
.grow .em{font-size:19px}
.grow .tx{flex:1;min-width:0}
.grow .nm{font-size:13.5px;font-weight:800}
.grow .ds{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbtn{font-size:11px;font-weight:900;border-radius:99px;padding:6px 14px;border:1.5px solid var(--line);background:#fff;color:var(--sub);letter-spacing:.06em;flex-shrink:0}
.gbtn.add{background:var(--olive);border-color:var(--olive);color:#fff}
.gbtn.rm2{background:var(--coral);border-color:var(--coral);color:#fff}

.tabbar button{font-size:13px;font-weight:900;color:var(--sub);background:none;border:none;padding:7px 20px;border-radius:99px;letter-spacing:.08em}
.tabbar button.on{background:var(--ink);color:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(24px);
background:var(--ink);color:var(--paper);font-size:12px;font-weight:800;padding:10px 22px;border-radius:99px;opacity:0;transition:all .3s;pointer-events:none;z-index:99;letter-spacing:.1em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:98;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.4}}
.timepop{position:fixed;inset:0;background:rgba(58,50,48,.4);z-index:80;display:none;align-items:center;justify-content:center}
.timepop.on{display:flex}
.tcard{background:#fff;border-radius:20px;padding:26px 26px 22px;text-align:center}
.tcard h4{font-size:14px;font-weight:900;margin-bottom:14px;letter-spacing:.06em}
.tcard input[type=time]{font-size:26px;font-weight:900;border:2px solid var(--coral);border-radius:12px;padding:8px 16px;color:var(--ink);font-family:inherit}
.tcard .tbtns{margin-top:16px;display:flex;gap:10px;justify-content:center}
.tcard button{font-size:13px;font-weight:900;border:none;border-radius:99px;padding:10px 24px}
.tcard .ok{background:var(--olive);color:#fff}
.tcard .qk{background:var(--soft);color:var(--sub)}
.qkrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.qkrow button{font-size:11px;padding:7px 13px;background:var(--soft);color:var(--ink);border:none;border-radius:99px;font-weight:800}

  $("bigNum").innerHTML=done+'<span> / '+tot+'</span>';
  $("barFill").style.width=(tot?Math.round(done/tot*100):0)+"%";
  $("heroSub").textContent=tot===0?"去挑几件想做的事吧":(done===tot?"今天全完成了，好好生活 ✓":"还剩 "+(tot-done)+" 件，一件一件来");
  /* 绑定 */
  document.querySelectorAll(".row .cir").forEach(function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-c");
      if(st.done[id]){delete st.done[id]}
      else{st.done[id]=1;toast("完成 ✓");burst()}
      save();render();
    };
  });
  document.querySelectorAll(".row .rm").forEach(function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-r");
      st.sel[id]=false;save();render();
      var h=H.filter(function(x){return x.id===id})[0];
      toast("已移除「"+(h?h.n:"")+"」· 可在编辑页加回");
    };
  });
  document.querySelectorAll(".row .tm").forEach(function(el){
    el.onclick=function(){openTime(el.getAttribute("data-t"))};
  });
}
/* 撒花 */
var CF=["🌸","✿","💛","🌿","⭐","🕊"];
function burst(){
  var all=H.filter(function(h){return st.sel[h.id]});
  var d=0;all.forEach(function(h){if(st.done[h.id])d++});
  if(d===all.length&&all.length>0){
    for(var i=0;i<26;i++){
      var s=document.createElement("div");s.className="confetti";
      s.textContent=CF[i%CF.length];
      s.style.left=(Math.random()*95+2)+"vw";
      s.style.animationDelay=(Math.random()*.7)+"s";
      document.body.appendChild(s);
      setTimeout(function(el){return function(){el.remove()}}(s),3200);
    }
    setTimeout(function(){toast("今天全部完成 · 明天见 🌙")},900);
  }
}
/* ============ 时间弹窗 ============ */
var curT=null;
function openTime(id){
  curT=id;
  var h=H.filter(function(x){return x.id===id})[0];
  $("tpTitle").textContent="「"+h.n+"」几点做？";
  $("tpInput").value=st.times[id];
  $("tpQuick").innerHTML=["+15 分钟","+30 分钟"].map(function(m){
    var t=st.times[id].split(":"),mi=+t[0]*60+ +t[1]+(m==="+15 分钟"?15:30);
    var nt=('0'+Math.floor(mi/60)).slice(-2)+":"+('0'+mi%60).slice(-2);
    return '<button data-q="'+nt+'">'+m+' → '+nt+'</button>'}).join("")+
    '<button data-q="'+h.t+'">回到默认 '+h.t+'</button>';
  $("tpQuick").querySelectorAll("button").forEach(function(b){
    b.onclick=function(){$("tpInput").value=b.getAttribute("data-q")};
  });
  $("timepop").classList.add("on");
}
$("tpOk").onclick=function(){if(curT){st.times[curT]=$("tpInput").value||st.times[curT];save();render();toast("时间已调整 ✓")}$("timepop").classList.remove("on")};
$("tpCancel").onclick=function(){$("timepop").classList.remove("on")};
/* ============ 编辑视图 ============ */
function renderEdit(){
  var h="";
  G.forEach(function(g){
    var items=H.filter(function(x){return x.g===g.id});
    var on=items.filter(function(x){return st.sel[x.id]}).length;
    h+='<div class="grp"><div class="grp-h"><span class="gi" style="background:'+g.c+'22">'+g.e+'</span>'+
    '<span><span class="gt">'+g.t+'</span><br><span class="gd">'+g.d+' · 已选 '+on+'/'+items.length+'</span></span></div>';
    items.forEach(function(x){
      var onx=st.sel[x.id];
      h+='<div class="grow'+(onx?"":" off")+'"><span class="em">'+x.e+'</span>'+
      '<span class="tx"><span class="nm">'+x.n+'</span><br><span class="ds">'+x.d+'</span></span>'+
      '<button class="gbtn '+(onx?"rm2":"add")+'" data-g="'+x.id+'">'+(onx?"移除":"加回")+'</button></div>';
    });
    h+='</div>';
  });
  $("grpHost").innerHTML=h;
  document.querySelectorAll(".gbtn").forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute("data-g");
      st.sel[id]=!st.sel[id];save();renderEdit();render();
      toast(st.sel[id]?"加回 ✓":"已移除");
    };
  });
}
/* ============ Tab ============ */
$("tabToday").onclick=function(){$("today").style.display="block";$("edit").style.display="none";this.classList.add("on");$("tabEdit").classList.remove("on")};
$("tabEdit").onclick=function(){$("today").style.display="none";$("edit").style.display="block";this.classList.add("on");$("tabToday").classList.remove("on");renderEdit()};
render();
})();
</script>
</body>
</html>
